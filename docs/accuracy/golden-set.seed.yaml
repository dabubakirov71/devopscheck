# Затравка живого эталонного набора для DevOps Audit (методика v2).
# ВАЖНО: все записи verified: false. Ожидания составлены по публично известной
# структуре репозиториев и ДОЛЖНЫ быть проверены вручную на зафиксированном SHA.
# ref заполняется при разметке (текущий HEAD default-ветки на момент проверки).
# Перечислены только утверждаемые проверки; остальные в прогоне не сравниваются.
# Имена проверок условные — сопоставить с реальными ID на этапе 0.

version: 1
repos:

  - repo: fastapi/fastapi
    platform: github
    ref: TODO
    verified: false
    expected_type: library
    checks:
      tests_in_ci: pass
      dockerfile_present: na
      container_nonroot: na
      dockerfile_multistage: na
      base_image_pinned: na
      dockerignore: na
      healthcheck: na
      compose_resource_limits: na
      observability: na
      changelog: pass          # docs/en/docs/release-notes.md
    notes: Главный кейс с лендинга. Проверить наличие SECURITY.md и CONTRIBUTING.

