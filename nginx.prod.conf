##############################################################################
# /etc/nginx/sites-available/your-domain.com
# DevOps Audit — optimized production Nginx config (host-level VPS)
#
# Deployment:
#   sudo cp nginx.prod.conf /etc/nginx/sites-available/your-domain.com
#   sudo ln -sf /etc/nginx/sites-available/your-domain.com \
#               /etc/nginx/sites-enabled/your-domain.com
#   sudo nginx -t && sudo systemctl reload nginx
#
# NOTE — limit_req_zone placement:
#   These directives belong in the http{} scope. This file is included inside
#   http{} by /etc/nginx/nginx.conf, so placing them here is valid. However,
#   if multiple sites-available files each define zones, move them to
#   /etc/nginx/nginx.conf to avoid "duplicate zone" errors.
##############################################################################

# Brute-force protection for auth endpoints: 10 requests/min per IP.
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;

# ── Upstream ──────────────────────────────────────────────────────────────────
# keepalive 32 reuses TCP connections to Gunicorn, cutting handshake overhead
# on every request. Requires proxy_http_version 1.1 + Connection "" below.
upstream django {
    server 127.0.0.1:8000;
    keepalive 32;
}

##############################################################################
# HTTP — redirect all traffic to canonical HTTPS URL (non-www)
##############################################################################
server {
    listen 80;
    listen [::]:80;
    server_name your-domain.com www.your-domain.com;

    # Certbot ACME challenge must pass through on port 80 for certificate renewal.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://your-domain.com$request_uri;
    }
}

##############################################################################
# HTTPS www → non-www canonical redirect
# Needs its own SSL block because it must terminate TLS before redirecting.
##############################################################################
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.your-domain.com;

    ssl_certificate     /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://your-domain.com$request_uri;
}

##############################################################################
# Main HTTPS server
##############################################################################
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name your-domain.com;

    ssl_certificate     /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ── Body size ─────────────────────────────────────────────────────────────
    # 20 MB global limit for file uploads and API payloads.
    # Webhook locations override this with 5 MB (IPN payloads are tiny).
    client_max_body_size 20m;

    # ── Gzip ──────────────────────────────────────────────────────────────────
    # gzip_proxied any — compress proxied responses regardless of upstream headers.
    # gzip_min_length 1024 — skip compressing sub-1 KB responses (CPU not worth it).
    # svg+xml — badge SVGs and inline icons; json — API and webhook responses.
    gzip             on;
    gzip_vary        on;
    gzip_proxied     any;
    gzip_comp_level  6;
    gzip_min_length  1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # ── Security headers ──────────────────────────────────────────────────────
    # !! Nginx add_header inheritance rule !!
    #    A child location block inherits server-level add_header ONLY when it
    #    defines NO add_header of its own. Locations with custom Cache-Control
    #    (currently: /static/ and /badge/) must repeat the security headers.
    #    See: http://nginx.org/en/docs/http/ngx_http_headers_module.html
    #
    # HSTS — 1-year max-age + preload flag (can be submitted to browser preload lists).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    # Clickjacking: allow framing only by the same origin.
    add_header X-Frame-Options           "SAMEORIGIN"                                   always;
    # Prevent MIME-type sniffing (guards against content-injection attacks).
    add_header X-Content-Type-Options    "nosniff"                                      always;
    # Send full URL as referrer on same-origin; only origin on cross-origin requests.
    add_header Referrer-Policy           "strict-origin-when-cross-origin"              always;

    # ── Common proxy settings ─────────────────────────────────────────────────
    # Inherited by all location blocks that don't define their own proxy_set_header.
    # (Same inheritance rule as add_header applies to proxy_set_header too.)
    proxy_http_version 1.1;
    proxy_set_header Connection         "";               # clear hop-by-hop for keepalive
    proxy_set_header Host               $host;
    proxy_set_header X-Real-IP          $remote_addr;
    proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto  $scheme;
    proxy_set_header X-Forwarded-Host   $host;
    proxy_redirect   off;

    # Default timeouts — individual endpoints override where needed.
    proxy_connect_timeout  5s;
    proxy_read_timeout    30s;
    proxy_send_timeout    30s;

    ##########################################################################
    # 1. STATIC FILES — served entirely by Nginx, Django never touched
    ##########################################################################
    location /static/ {
        alias      /opt/devops_audit/staticfiles_data/;
        access_log off;
        tcp_nopush on;

        # Serve pre-compressed .gz files when present (run `gzip -k file` after
        # collectstatic, or use WhiteNoise CompressedManifestStaticFilesStorage).
        gzip_static on;

        # Security headers repeated here because this block has its own add_header.
        # immutable tells browsers never to revalidate (safe because filenames
        # are content-hashed by Django's ManifestStaticFilesStorage).
        add_header Cache-Control             "public, immutable"                                always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload"    always;
        add_header X-Content-Type-Options    "nosniff"                                         always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin"                 always;

        expires 30d;
    }

    ##########################################################################
    # 2. HEALTH CHECK — answered by Nginx itself, zero Django overhead
    # Uses default_type (not add_header) so security headers are inherited.
    ##########################################################################
    location = /health/ {
        access_log   off;
        default_type text/plain;
        return 200   "OK\n";
    }

    ##########################################################################
    # 3. BADGE SVG — dynamic score, short public cache (5 minutes)
    # stale-while-revalidate: proxy/CDN can serve the previous badge for 60 s
    # while fetching a fresh one in the background, avoiding badge flicker.
    ##########################################################################
    location ~* ^/badge/[^/]+\.svg$ {
        proxy_pass http://django;

        # Security headers repeated (block has its own add_header).
        add_header Cache-Control             "public, max-age=300, stale-while-revalidate=60" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload"   always;
        add_header X-Content-Type-Options    "nosniff"                                        always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin"                always;
    }

    ##########################################################################
    # 4. AUDIT ENDPOINTS — extended timeouts
    ##########################################################################

    # POST /audit/<id>/run/  — Django waits for the Celery task to be accepted
    # (up to 120 s). 125 s gives a 5 s margin before Nginx would 504 first.
    location ~* ^/audit/[^/]+/run/ {
        proxy_pass          http://django;
        proxy_read_timeout  125s;
        proxy_send_timeout  125s;
    }

    # POST /audit/<id>/ai/  — synchronous LLM call (Claude / GPT / Gemini), ≤60 s.
    location ~* ^/audit/[^/]+/ai/ {
        proxy_pass          http://django;
        proxy_read_timeout  65s;
        proxy_send_timeout  65s;
    }

    # GET /audit/<id>/pdf/  — server-side PDF rendering, up to 60 s.
    location ~* ^/audit/[^/]+/pdf/ {
        proxy_pass          http://django;
        proxy_read_timeout  65s;
        proxy_send_timeout  65s;
    }

    # GET /audit/<id>/status/  — 3-second AJAX polling.
    # Default 30 s timeout is sufficient; falls through to location / below.

    ##########################################################################
    # 5. WEBHOOK ENDPOINTS — no rate limiting, 5 MB body, 35 s timeout
    #
    # External services (GitHub, Lemon Squeezy, Cryptomus) POST from
    # arbitrary IPs. Authentication is done via HMAC-SHA256 signature
    # verification inside Django — do not IP-allowlist here.
    # 35 s = 30 s handler + 5 s margin to avoid a race between app and Nginx.
    ##########################################################################

    # GitHub push / PR webhooks (URL includes per-repo HMAC secret)
    location ~* ^/webhook/github/ {
        proxy_pass            http://django;
        proxy_read_timeout    35s;
        proxy_send_timeout    35s;
        client_max_body_size  5m;
    }

    # Lemon Squeezy IPN — subscription_created, subscription_cancelled, etc.
    location = /billing/webhooks/ls/ {
        proxy_pass            http://django;
        proxy_read_timeout    35s;
        proxy_send_timeout    35s;
        client_max_body_size  5m;
    }

    # Cryptomus crypto IPN
    location = /billing/webhooks/crypto/ {
        proxy_pass            http://django;
        proxy_read_timeout    35s;
        proxy_send_timeout    35s;
        client_max_body_size  5m;
    }

    ##########################################################################
    # 6. AUTH — rate-limited against brute-force / credential stuffing
    # burst=5: allows up to 5 queued requests before 429 is returned.
    # nodelay: serves burst requests immediately instead of spreading them out.
    ##########################################################################
    location ~* ^/(login|register)/ {
        proxy_pass       http://django;
        limit_req        zone=auth burst=5 nodelay;
        limit_req_status 429;
    }

    ##########################################################################
    # 7. ROBOTS.TXT / SITEMAP.XML
    # Proxied to Django so content can be managed dynamically.
    # Uses the expires directive (not add_header) to preserve security-header
    # inheritance from the server block.
    ##########################################################################
    location = /robots.txt {
        proxy_pass http://django;
        expires    1d;
    }

    location = /sitemap.xml {
        proxy_pass http://django;
        expires    1h;
    }

    ##########################################################################
    # 8. ADMIN — not here, and not proxied
    #
    # The admin runs as its own process (ADMIN_SITE=1) bound to 127.0.0.1:8001
    # and is reached over an SSH tunnel; see DEPLOY.md. Django's public URL
    # configuration does not route /admin/ at all, so this block is belt and
    # braces: it answers the scanners without waking Gunicorn, and it makes the
    # intent explicit to whoever edits this file next.
    #
    # Do NOT add a proxy_pass here. Putting the admin login form on the public
    # domain is the single highest-value target the product has.
    ##########################################################################
    location ^~ /admin/ {
        access_log off;
        return 404;
    }

    ##########################################################################
    # 9. EVERYTHING ELSE
    # Landing (/), auth pages, dashboard, GitLab, profile, billing, billing
    # checkout/cancel/success, REST API (/api/v1/), public audit pages.
    # Inherits all server-level security headers and proxy settings.
    ##########################################################################
    location / {
        proxy_pass http://django;
    }
}