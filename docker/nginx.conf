##############################################################################
# docker/nginx.conf — DevOps Audit, Docker-internal Nginx
# Expanded at container startup via: envsubst '${DOMAIN}' < nginx.conf > /etc/nginx/nginx.conf
#
# Variables substituted by envsubst:
#   ${DOMAIN} — e.g. devopscheck.com
##############################################################################

# Brute-force protection for auth endpoints: 10 requests/min per IP.
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;

# ── Upstream ──────────────────────────────────────────────────────────────────
# 'web' is the Docker Compose service name for the Gunicorn container.
# keepalive 32 reuses connections, cutting TCP handshake overhead per request.
upstream django {
    server web:8000;
    keepalive 32;
}

##############################################################################
# HTTP — redirect to HTTPS
##############################################################################
server {
    listen 80;
    listen [::]:80;
    server_name ${DOMAIN} www.${DOMAIN};

    # Certbot ACME challenge passthrough for certificate renewal.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://${DOMAIN}$request_uri;
    }
}

##############################################################################
# HTTPS www → non-www redirect
##############################################################################
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.${DOMAIN};

    ssl_certificate     /etc/letsencrypt/live/${DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${DOMAIN}/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_tickets off;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://${DOMAIN}$request_uri;
}

##############################################################################
# Main HTTPS server
##############################################################################
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ${DOMAIN};

    ssl_certificate     /etc/letsencrypt/live/${DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${DOMAIN}/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_tickets off;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ── Body size ─────────────────────────────────────────────────────────────
    client_max_body_size 20m;

    # ── Gzip ──────────────────────────────────────────────────────────────────
    gzip             on;
    gzip_vary        on;
    gzip_proxied     any;
    gzip_comp_level  6;
    gzip_min_length  1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # ── Security headers ──────────────────────────────────────────────────────
    # !! add_header inheritance rule: a location with its own add_header directives
    #    does NOT inherit these. /static/ and /badge/ repeat them explicitly. !!
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options           "SAMEORIGIN"                                   always;
    add_header X-Content-Type-Options    "nosniff"                                      always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"              always;

    # ── Common proxy settings ─────────────────────────────────────────────────
    proxy_http_version 1.1;
    proxy_set_header Connection         "";
    proxy_set_header Host               $host;
    proxy_set_header X-Real-IP          $remote_addr;
    proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto  $scheme;
    proxy_set_header X-Forwarded-Host   $host;
    proxy_redirect   off;

    proxy_connect_timeout  5s;
    proxy_read_timeout    30s;
    proxy_send_timeout    30s;

    ##########################################################################
    # 1. STATIC FILES
    ##########################################################################
    location /static/ {
        alias      /app/staticfiles/;
        access_log off;
        tcp_nopush on;
        gzip_static on;

        # Security headers repeated (block has its own add_header).
        add_header Cache-Control             "public, immutable"                                always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload"    always;
        add_header X-Content-Type-Options    "nosniff"                                         always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin"                 always;

        expires 30d;
    }

    ##########################################################################
    # 2. HEALTH CHECK — answered by Nginx, Django never hit
    ##########################################################################
    location = /health/ {
        access_log   off;
        default_type text/plain;
        return 200   "OK\n";
    }

    ##########################################################################
    # 3. BADGE SVG — 5-minute public cache
    ##########################################################################
    location ~* ^/badge/[^/]+\.svg$ {
        proxy_pass http://django;

        # Security headers repeated (block has its own add_header).
        add_header Cache-Control             "public, max-age=300, stale-while-revalidate=60" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload"   always;
        add_header X-Content-Type-Options    "nosniff"                                        always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin"                always;
    }

    ##########################################################################
    # 4. AUDIT ENDPOINTS — extended timeouts
    ##########################################################################

    location ~* ^/audit/[^/]+/run/ {
        proxy_pass          http://django;
        proxy_read_timeout  125s;
        proxy_send_timeout  125s;
    }

    location ~* ^/audit/[^/]+/ai/ {
        proxy_pass          http://django;
        proxy_read_timeout  65s;
        proxy_send_timeout  65s;
    }

    location ~* ^/audit/[^/]+/pdf/ {
        proxy_pass          http://django;
        proxy_read_timeout  65s;
        proxy_send_timeout  65s;
    }

    ##########################################################################
    # 5. WEBHOOK ENDPOINTS — no rate limiting, 5 MB body, 35 s timeout
    ##########################################################################

    location ~* ^/webhook/github/ {
        proxy_pass            http://django;
        proxy_read_timeout    35s;
        proxy_send_timeout    35s;
        client_max_body_size  5m;
    }

    location = /billing/webhooks/ls/ {
        proxy_pass            http://django;
        proxy_read_timeout    35s;
        proxy_send_timeout    35s;
        client_max_body_size  5m;
    }

    location = /billing/webhooks/crypto/ {
        proxy_pass            http://django;
        proxy_read_timeout    35s;
        proxy_send_timeout    35s;
        client_max_body_size  5m;
    }

    ##########################################################################
    # 6. AUTH — rate-limited
    ##########################################################################
    location ~* ^/(login|register)/ {
        proxy_pass       http://django;
        limit_req        zone=auth burst=5 nodelay;
        limit_req_status 429;
    }

    ##########################################################################
    # 7. ROBOTS.TXT / SITEMAP.XML
    ##########################################################################
    location = /robots.txt {
        proxy_pass http://django;
        expires    1d;
    }

    location = /sitemap.xml {
        proxy_pass http://django;
        expires    1h;
    }

    ##########################################################################
    # 8. EVERYTHING ELSE
    ##########################################################################
    location / {
        proxy_pass http://django;
    }
}